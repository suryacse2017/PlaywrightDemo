name: Demo1Copilot Playwright Tests

on:
  push:
    branches: [Surya1]

  pull_request:
    branches: [main]

  schedule:
    - cron: '0 22 * * 1'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Demo1Copilot tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Demo1Copilot tests
        run: npm run test:demo1copilot

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo1copilot-playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Demo1Copilot Playwright Tests - ${{ job.status }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: GitHub Actions <${{ secrets.SMTP_USERNAME }}>
          body: |
            Hello,

            The GitHub Actions workflow "Demo1Copilot Playwright Tests" finished with status: ${{ job.status }}.

            Workflow: ${{ github.workflow }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Thanks,
            GitHub Actions
          attachments: |
            playwright-report/**