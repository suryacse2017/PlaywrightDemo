name: Playwright Tests

on:
  push:
    branches: [main, Surya1]

  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate BDD tests
        run: npx bddgen

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Zip Playwright report
        if: always()
        run: zip -r playwright-report.zip playwright-report/

      - name: Send Playwright report by email
        if: always()
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Playwright Test Report - ${{ job.status }}
          body: |
            Playwright automation execution completed.

            Test Status: ${{ job.status }}
            Branch: ${{ github.ref_name }}
            Repository: ${{ github.repository }}

            The Playwright HTML report is attached.
          to: ${{ secrets.EMAIL_USERNAME }}
          from: Playwright Automation <${{ secrets.EMAIL_USERNAME }}>
          attachments: playwright-report.zip
