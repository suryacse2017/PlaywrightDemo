
name: Demo1Copilot Playwright Tests

on:
  push:
    branches: [Surya1]

  pull_request:
    branches: [main]

  # Run every Monday at 6:00 PM EDT (10:00 PM UTC)
  schedule:
    - cron: '0 22 * * 1'

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Demo1Copilot tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Demo1Copilot tests
        run: npm run test:demo1copilot

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo1copilot-playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 30
