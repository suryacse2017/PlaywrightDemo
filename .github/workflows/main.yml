name: Demo1Copilot Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  schedule:
    - cron: '0 22 * * 1'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Demo1Copilot tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: 'true'
      EMAIL_CONFIGURED: ${{ secrets.SMTP_SERVER != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.NOTIFY_EMAIL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Demo1Copilot tests
        run: npm run test:demo1copilot

      - name: Prepare email report and archive
        if: always()
        run: |
          node scripts/email-report.cjs
          if [ -d playwright-report ]; then
            zip -qr playwright-report.zip playwright-report
          else
            mkdir -p email-attachments
            cp email-report.html email-attachments/
            printf '%s\n' 'The interactive Playwright report was not generated. See the workflow run for details.' > email-attachments/report-unavailable.txt
            zip -qr playwright-report.zip email-attachments
          fi
          if [ -f test-results.json ]; then
            zip -q playwright-report.zip test-results.json
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW_STATUS: ${{ job.status }}
          REPORT_TITLE: Demo1Copilot Test Report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo1copilot-playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results.json
            test-results/
          if-no-files-found: ignore
          retention-days: 30

